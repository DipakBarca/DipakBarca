<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact</title>
    <meta name="description" content="Phone, WhatsApp, address, opening hours and emergency numbers." />
    <meta name="theme-color" content="#0b7a5a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/contact.js"></script>
  </head>
  <body data-page="contact" data-title-key="contact_title">
    <header class="site-header">
      <div class="container">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg></span>
          <span data-shop="name">Pharmacy</span>
        </a>
        <button class="lang-btn" type="button" data-lang-toggle data-i18n="lang_switch">नेपाली</button>
      </div>
      <nav class="nav container" aria-label="Main">
        <a href="index.html" data-nav="home" data-i18n="nav_home">Home</a>
        <a href="medicines.html" data-nav="medicines" data-i18n="nav_medicines">Medicines</a>
        <a href="contact.html" data-nav="contact" data-i18n="nav_contact">Contact</a>
      </nav>
    </header>

    <main class="container">
      <h1 data-i18n="contact_title">Contact us</h1>
      <div class="status" data-status role="status"></div>

      <section class="contact-list">
        <div class="card">
          <h2 data-i18n="phone">Phone</h2>
          <p><a data-shop-href="tel" data-shop="phone"></a></p>
          <div class="btn-row">
            <a class="btn btn-primary" data-shop-href="tel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" /></svg>
              <span data-i18n="call">Call</span>
            </a>
            <a class="btn btn-whatsapp" data-shop-href="whatsapp" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg>
              <span data-i18n="whatsapp">WhatsApp</span>
            </a>
          </div>
        </div>

        <div class="card">
          <h2 data-i18n="address">Address</h2>
          <p data-shop="address"></p>
          <p class="muted"><span data-i18n="landmark">Landmark</span>: <span data-shop="landmark"></span></p>
          <a class="btn btn-outline" data-shop-href="maps" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>
            <span data-i18n="open_maps">Open in Google Maps</span>
          </a>
        </div>

        <div class="card">
          <h2 data-i18n="hours_title">Opening hours</h2>
          <table class="hours"><tbody id="hours"></tbody></table>
        </div>

        <div>
          <h2 data-i18n="emergency_title">Emergency numbers</h2>
          <div class="emergency">
            <a href="tel:102"><span data-i18n="ambulance">Ambulance</span><strong id="num-ambulance">102</strong></a>
            <a href="tel:100"><span data-i18n="police">Police</span><strong id="num-police">100</strong></a>
            <a class="wide" id="hospital"><span data-i18n="nearest_hospital">Nearest hospital</span> · <span id="hospital-name"></span><strong id="hospital-phone"></strong></a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="rx" data-i18n="rx_note"></p>
        <p>© <span data-year></span> <span data-shop="name"></span> · <a href="admin.html" data-i18n="staff_login">Staff</a></p>
      </div>
    </footer>
  </body>
</html>
